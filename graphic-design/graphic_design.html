<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphic Design | Youssef</title>

  <link rel="stylesheet" href="../css/graphic-design.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="page-header">
    <a href="../index.html" class="back-btn">← Back</a>
    <h1>Graphic Design</h1>
  </header>

  <section class="portfolio">

    <!-- PORTFOLIO (UNCHANGED STRUCTURE + TEXT ABOVE) -->
    <h2 class="section-title">Portfolio</h2>

    <div class="portfolio-grid">
      <div class="card-wrapper">
        <p class="card-top-title">Sout Sharq</p>
        <div class="portfolio-card">
          <span class="duration">2022 – 20XX</span>
          <img src="../assets/soutsharq.png" alt="Sout Sharq">
        </div>
      </div>

      <div class="card-wrapper">
        <p class="card-top-title">Mtown Studios</p>
        <div class="portfolio-card">
          <span class="duration">2022 – 2024</span>
          <img src="../assets/mtownstudios.jpg" alt="Mtown Studios">
        </div>
      </div>

      <div class="card-wrapper">
        <p class="card-top-title">IM Rubiks</p>
        <div class="portfolio-card">
          <span class="duration">2024 – 2024</span>
          <img src="../assets/imrubiks.png" alt="IM Rubiks">
        </div>
      </div>

      <div class="card-wrapper">
        <p class="card-top-title">OLYVE</p>
        <div class="portfolio-card">
          <span class="duration">2025 – 20XX</span>
          <img src="../assets/olyve.jpg" alt="Olyve">
        </div>
      </div>

      <div class="card-wrapper">
        <p class="card-top-title">Projects
        </p>
        <div class="portfolio-card">
          <span class="duration">Freelance</span>
          <img src="../assets/elmalahy.jpg" alt="El Malahy">
        </div>
      </div>
    </div>

    <!-- POSTERS -->
    <h2 class="section-title">Posters</h2>

    <div class="portfolio-grid two">
      <div class="card-wrapper">
        <div class="portfolio-card">
          <img src="../assets/mtown_poster.jpg" alt="Mtown Poster">
        </div>
        <p class="card-title">Mtown Poster</p>
      </div>

      <div class="card-wrapper">
        <div class="portfolio-card">
          <img src="../assets/cairoke_poster.jpg" alt="Cairoke Poster">
        </div>
        <p class="card-title">Cairoke Poster</p>
      </div>
    </div>

    <!-- EXHIBITIONS -->
    <h2 class="section-title">Exhibitions</h2>

    <div class="portfolio-grid two">
      <div class="card-wrapper">
        <div class="portfolio-card">
          <img src="../assets/zeman awwal.JPG" alt="Exhibition 1">
        </div>
        <p class="card-title">Zeman Awal at Dubai Air Mall</p>
      </div>

      <div class="card-wrapper">
        <div class="portfolio-card">
          <img src="../assets/abstraction.jpg" alt="Exhibition 2">
        </div>
        <p class="card-title">Abstraction Exhibition</p>
      </div>
    </div>

  </section>

  <script src="../js/main.js"></script>
</body>
</html>
